<script>
const KEY='dandara-demo-v2';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!state||!Array.isArray(state.members))state={members:[{id:'001',name:'お客様A',points:0,expiry:null},{id:'002',name:'お客様B',points:0,expiry:null}],history:[]};let snapshots=[];let active='customer';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('保存できませんでした。ブラウザの設定を確認してください。')}}
function current(){return state.members.find(x=>x.id===document.getElementById('member').value)||state.members[0]}
function dateNextYear(){let d=new Date();let year=d.getFullYear();d.setFullYear(year+1);return d.toLocaleDateString('ja-JP')}
function render(){let s=document.getElementById('member'),id=s.value||state.members[0].id;s.innerHTML=state.members.map(m=>'<option value="'+m.id+'">'+escapeHtml(m.name)+'（'+m.id+'）</option>').join('');s.value=state.members.some(m=>m.id===id)?id:state.members[0].id;let m=current();document.getElementById('mid').textContent='会員番号 '+m.id;document.getElementById('pts').textContent=m.points;document.getElementById('expiry').textContent='有効期限：'+(m.expiry||'未設定');let n=m.points%10;document.getElementById('stamps').innerHTML=Array.from({length:10},(_,i)=>'<div class="stamp '+(i<n?'on':'')+'">'+(i<n?'印':'・')+'</div>').join('');document.getElementById('history').innerHTML=state.history.slice(-8).reverse().map(h=>'<li>'+escapeHtml(h)+'</li>').join('')||'<li>まだ操作はありません</li>';preview()}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tab(x){active=x;document.getElementById('customerView').classList.toggle('hidden',x!=='customer');document.getElementById('adminView').classList.toggle('hidden',x!=='admin');document.getElementById('customerTab').classList.toggle('off',x!=='customer');document.getElementById('adminTab').classList.toggle('off',x!=='admin');render()}
function calc(){let raw=document.getElementById('amount').value;let v=Number(raw);return raw!==''&&Number.isSafeInteger(v)&&v>=0?Math.min(5,Math.floor(v/1000)):null}
function preview(){let p=calc();document.getElementById('preview').textContent=p===null?'正しい金額を入力してください':'今回の付与予定：'+p+'ポイント（最大5ポイント）'}
function msg(s){let el=document.getElementById('msg');el.textContent=s;el.style.display='block'}
function snapshot(){snapshots.push(JSON.stringify(state));if(snapshots.length>20)snapshots.shift()}
function addMember(){let name=document.getElementById('newName').value.trim()||'お客様'+(state.members.length+1);snapshot();let id=String(Math.max(0,...state.members.map(m=>Number(m.id)))+1).padStart(3,'0');state.members.push({id,name,points:0,expiry:null});state.history.push(name+'：会員登録');save();render();document.getElementById('member').value=id;render();document.getElementById('newName').value='';msg(name+'を登録しました')}
function earn(){let n=calc();if(n===null)return msg('正しい税込金額を入力してください');if(n===0)return msg('1,000円未満は付与ポイントなし');let m=current();snapshot();m.points+=n;m.expiry=dateNextYear();state.history.push(m.name+'：+'+n+'ポイント');save();render();msg(m.name+'に'+n+'ポイント付与しました')}
function redeem(){let m=current();if(m.points<10)return msg('交換には10ポイント必要です');if(!confirm(m.name+'の10ポイントを使って特典交換しますか？'))return;snapshot();m.points-=10;m.expiry=dateNextYear();state.history.push(m.name+'：特典交換 -10ポイント');save();render();msg('特典交換しました')}
function undo(){if(!snapshots.length)return msg('この画面で取り消せる操作はありません');state=JSON.parse(snapshots.pop());save();render();msg('直前の操作を取り消しました')}
render();
</script></body></html>
